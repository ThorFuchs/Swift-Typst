name: TypstProductionConsumer
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTypst:
    path: ../..
targets:
  TypstProductionConsumer:
    type: application
    platform: iOS
    sources:
      - App.swift
    dependencies:
      - package: SwiftTypst
        product: SwiftTypst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.swift-typst.production-consumer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TypstProductionConsumerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: TypstProductionConsumer
      - package: SwiftTypst
        product: SwiftTypst
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.swift-typst.production-consumer.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  TypstProductionConsumer:
    build:
      targets:
        TypstProductionConsumer: all
        TypstProductionConsumerTests: [test]
    test:
      targets:
        - TypstProductionConsumerTests
