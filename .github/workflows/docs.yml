name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'Sources/SwiftTypst/**'
      - 'Sources/CTypstBridge/include/**'
      - 'Scripts/build-docc.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'Sources/SwiftTypst/**'
      - 'Sources/CTypstBridge/include/**'
      - 'Scripts/build-docc.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build DocC reference
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check compiler version
        run: swift --version | grep -E 'Swift version 6\.4\.2'
      - name: Build and validate static DocC site
        run: sh Scripts/build-docc.sh
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .build/docc-site
          include-hidden-files: true
  deploy:
    name: Publish DocC reference
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
